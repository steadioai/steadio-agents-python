[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadio-agents"
version = "0.1.0"
description = "Per-run cost and spend-cap visibility for the OpenAI Agents SDK, via a SteadIO TracingProcessor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["steadio", "openai-agents", "tracing", "llm-cost", "spend-cap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No install-time requirements on purpose: the processor is stdlib-only and
# duck-types against the Agents SDK, so it can be imported in a process that
# has not installed it (tests, cost-only tooling).
dependencies = []

[project.optional-dependencies]
agents = ["openai-agents>=0.0.1"]

[project.urls]
Homepage = "https://steadio.ai"
Documentation = "https://github.com/steadioai/steadio-agents-python#readme"
Source = "https://github.com/steadioai/steadio-agents-python"

[tool.hatch.build.targets.wheel]
packages = ["steadio_agents"]
